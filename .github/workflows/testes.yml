name: testes

# Roda SEMPRE, sem cache de "já passou". O pulo por conteúdo existe só do lado
# local (scripts/testar.py do conta-tools-shared).
#
# Este é o workflow mais simples do ecossistema, e por duas razões que valem
# ficar registradas:
#
# 1. O relaix é PÚBLICO, então Actions aqui não consome cota nenhuma da conta
#    (repositório privado consome; público, não).
# 2. O relaix NÃO depende do conta-tools-shared -- é independente por decisão,
#    com réplicas inline vigiadas por hash (item 21 da auditoria). Por isso não
#    precisa do secret CONTA_TOOLS_PAT que auth/empresas/extrato exigem: não há
#    repositório privado pra clonar.
#
# O que este CI NÃO cobre: a divergência das réplicas inline em relação ao
# conta-tools-shared. Quem vigia isso é o item 21, que roda no pre-commit do
# conta-tools-shared (é lá que as funções originais vivem), não aqui.

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Mesma versão do servidor de produção (C:\Python\Python313).
          python-version: '3.13'
          cache: pip

      - name: Instalar o pacote e as dependências de teste
        run: pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest -q
